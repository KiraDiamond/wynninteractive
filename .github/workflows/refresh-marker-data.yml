name: Refresh Marker Data

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: write

concurrency:
  group: marker-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh current marker categories and mobs
        run: npm run refresh:data

      - name: Validate refreshed data
        run: npm run check

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated-marker-supplements.js data/generated-marker-position-overrides.js data/generated-fast-travel-markers.js data/generated-mob-markers.js data/generated-mob-counts.js data/content/mob-content.js data/marker-refresh-summary.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh marker and mob data"
          git push
